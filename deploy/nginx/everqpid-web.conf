# EverQpid Flutter Web — Nginx (Ubuntu / aaPanel)
#
# Deploy path example: /www/wwwroot/web.everqpid.com
# Paste into aaPanel → Site → Config (or include from conf.d).
# Adjust server_name, root, and SSL certificate paths.

# Optional: HTTP → HTTPS redirect (aaPanel often owns this)
# server {
#     listen 80;
#     listen [::]:80;
#     server_name web.everqpid.com;
#     return 301 https://$host$request_uri;
# }

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name web.everqpid.com;

    # aaPanel / Let's Encrypt paths (adjust):
    # ssl_certificate     /www/server/panel/vhost/cert/web.everqpid.com/fullchain.pem;
    # ssl_certificate_key /www/server/panel/vhost/cert/web.everqpid.com/privkey.pem;

    root /www/wwwroot/web.everqpid.com;
    index index.html;

    # --- Security headers (see docs/SECURITY.md) ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self)" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    # COEP / strict CSP: enable only after Google Sign-In + Firebase + S3 smoke tests.
    # add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # --- Compression ---
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml
        application/manifest+json
        font/woff2;

    # If ngx_brotli is installed (aaPanel Soft → Nginx → brotli):
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;

    # WASM MIME (CanvasKit)
    types {
        application/wasm wasm;
    }
    # Keep default MIME map — aaPanel usually includes mime.types already.
    include mime.types;
    default_type application/octet-stream;

    # --- Never cache the app shell / SW / version ---
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    location = /manifest.json {
        add_header Cache-Control "no-cache" always;
    }

    # FCM web worker — must ship with each deploy; do not overwrite with Flutter SW
    location = /firebase-messaging-sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires -1;
    }

    # --- Immutable hashed Flutter assets ---
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /canvaskit/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /icons/ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    location ~* \.(js|wasm|css)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # --- SPA fallback (path URL strategy / deep links / refresh) ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: deny hidden files
    location ~ /\. {
        deny all;
    }
}
