name: Flutter CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Unit & widget tests
        run: flutter test --coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-lcov
          path: coverage/lcov.info

      # Goldens are platform-sensitive; generate locally with:
      #   flutter test --update-goldens test/golden
      # and enable this job when PNGs are committed:
      # - name: Golden tests
      #   run: flutter test test/golden

      # Integration tests need a device/emulator:
      # - name: Integration
      #   run: flutter test integration_test/app_flow_test.dart -d flutter-tester
